name: Scrape KVD closed auctions

on:
  schedule:
    # Kör varje natt kl 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch:   # Manuell körning från Actions-fliken

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        # Ta bort --max när du vill skrapa alla
        run: python scraper.py --max 50

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Update KVD closed auctions $(date -u +%Y-%m-%d)"
          git push
