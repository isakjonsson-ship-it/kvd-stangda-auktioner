name: Scrape KVD closed auctions

on:
  schedule:
    # GitHub Actions tappar ofta schemalagda körningar vid minut 0 (hög last
    # vid hel timme). En udda minut gör att timkörningen faktiskt blir av.
    # Taket är kvar på 50 per körning.
    - cron: "17 * * * *"
  workflow_dispatch:   # Manuell körning från Actions-fliken

# En körning åt gången, även om försenade scheman eller en manuell körning
# råkar sammanfalla. Pågående körning avbryts inte. En ny körning väntar,
# och en ännu nyare ersätter den som redan står i kö, så vi varken
# överlappar git push eller skickar en skur av anrop mot KVD.
concurrency:
  group: scrape-kvd
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    # 50 anrop med timeout 30s ryms här. En hängd körning ska inte blockera
    # kön i sex timmar när schemat går varje timme.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        # Max 50 per körning så vi betar igenom allt sakta
        run: python scraper.py --max 50

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Update KVD closed auctions $(date -u +%Y-%m-%d)"
          git push
